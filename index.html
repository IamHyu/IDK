<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Meu Amor 💖</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #8b5cf6 0%, #6d28d9 35%, #312e81 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-ball {
      position: absolute;
      border-radius: 999px;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 10s ease-in-out infinite;
    }

    .ball1 {
      width: 300px;
      height: 300px;
      background: #c084fc;
      top: -50px;
      left: -50px;
      opacity: 0.7;
    }

    .ball2 {
      width: 350px;
      height: 350px;
      background: #93c5fd;
      bottom: -100px;
      right: -100px;
      animation-duration: 14s;
    }

    .ball3 {
      width: 250px;
      height: 250px;
      background: #86efac;
      top: 40%;
      left: 40%;
      animation-duration: 18s;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(-30px) translateX(30px);
      }
    }

    @keyframes fall {
      from {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }

    .glass {
      backdrop-filter: blur(25px);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow:
        0 8px 32px rgba(31, 38, 135, 0.37),
        inset 0 0 20px rgba(255,255,255,0.08);
    }

    .heart {
      position: fixed;
      top: -20px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="bg-ball ball1"></div>
  <div class="bg-ball ball2"></div>
  <div class="bg-ball ball3"></div>

  <div id="card" class="glass rounded-[40px] p-10 max-w-2xl w-[90%] text-center text-white relative z-10 transition-all duration-500">
    <h1 id="title" class="text-6xl font-bold mb-6 drop-shadow-lg">Para o amor da minha vida 💜</h1>

    <p id="text" class="text-xl mb-8 leading-relaxed">
      Desde que você apareceu na minha vida, tudo ficou mais bonito.
    </p>

    <p id="question" class="text-2xl font-semibold mb-10">
      Você aceita continuar sendo a pessoa mais especial da minha vida? ✨
    </p>

    <div class="flex justify-center gap-6 h-24 items-center relative">
      <button
        id="yesBtn"
        class="bg-gradient-to-r from-cyan-300 to-purple-300 hover:scale-110 transition-all px-10 py-4 rounded-full text-2xl font-bold text-white shadow-2xl border border-white/40"
      >
        Sim 💖
      </button>

      <button
        id="noBtn"
        class="bg-gradient-to-r from-pink-300 to-purple-300 px-10 py-4 rounded-full text-2xl font-bold text-white shadow-2xl border border-white/40 absolute right-10 transition-all duration-200"
      >
        Não 😭
      </button>
    </div>
  </div>

  <script>
    const questions = [
      {
        title: 'Para o amor da minha vida 💜',
        text: 'Desde que você apareceu na minha vida, tudo ficou mais bonito.',
        question: 'Você gosta de viver momentos comigo? ✨'
      },
      {
        title: 'Você é meu lugar favorito 💙',
        text: 'Cada conversa e sorriso seu deixa meu dia melhor.',
        question: 'Promete continuar comigo por muito tempo? 💖'
      },
      {
        title: 'Última pergunta 💚',
        text: 'Você transformou minha vida em algo muito mais feliz.',
        question: 'Aceita ser meu amor pra sempre? 💍'
      }
    ];

    let step = 0;

    const title = document.getElementById('title');
    const text = document.getElementById('text');
    const question = document.getElementById('question');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const card = document.getElementById('card');

    noBtn.addEventListener('mouseenter', () => {
      const currentX = noBtn.offsetLeft;
      const currentY = noBtn.offsetTop;

      const moveX = (Math.random() * 120) - 60;
      const moveY = (Math.random() * 60) - 30;

      let newX = currentX + moveX;
      let newY = currentY + moveY;

      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      newX = Math.max(20, Math.min(newX, maxX));
      newY = Math.max(20, Math.min(newY, maxY));

      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    });

    yesBtn.addEventListener('click', () => {
      step++;

      if(step < questions.length){
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';

        setTimeout(() => {
          title.innerText = questions[step].title;
          text.innerText = questions[step].text;
          question.innerText = questions[step].question;

          card.style.opacity = '1';
          card.style.transform = 'scale(1)';
        }, 300);
      } else {
        showFinal();
      }
    });

    function showFinal(){
      card.innerHTML = `
        <div class="glass rounded-3xl p-8">
          <div class="text-5xl mb-6">💌</div>

          <h1 class="text-4xl font-bold mb-6">
            Carta de Amor
          </h1>

          <p class="text-xl leading-relaxed mb-8">
            Você é a melhor parte dos meus dias.
            Obrigado por existir, por me fazer sorrir
            e por deixar minha vida muito mais feliz.
            Eu te amo infinitamente 💖
          </p>

          <div class="text-5xl font-bold text-pink-300 animate-pulse">
            💖 EU TE AMO 💖
          </div>
        </div>
      `;

      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '💖';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }, 200);
    }
  </script>
</body>
</html>
