<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<title>Para Meu Amor 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:manipulation;
}

body{
font-family:"Inter",sans-serif;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
position:relative;
overflow:hidden;
color:white;

background:
radial-gradient(circle at top left,#8b5cf6 0%,transparent 25%),
radial-gradient(circle at bottom right,#38bdf8 0%,transparent 25%),
linear-gradient(135deg,#0f172a 0%,#1e1b4b 45%,#312e81 100%);
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);

background-size:34px 34px;

opacity:.2;

animation:bgMove 14s linear infinite;
}

@keyframes bgMove{
from{
transform:translateY(0px);
}
to{
transform:translateY(-34px);
}
}

.bg{
position:absolute;
border-radius:999px;
filter:blur(90px);
opacity:.5;
animation:float 12s ease-in-out infinite;
}

.bg1{
width:300px;
height:300px;
background:#8b5cf6;
top:-100px;
left:-100px;
}

.bg2{
width:320px;
height:320px;
background:#38bdf8;
right:-120px;
bottom:-120px;
animation-duration:16s;
}

.bg3{
width:240px;
height:240px;
background:#4ade80;
left:40%;
top:45%;
animation-duration:20s;
}

@keyframes float{
0%,100%{
transform:translate(0,0);
}

50%{
transform:translate(35px,-35px);
}
}

.card{
width:100%;
max-width:430px;

padding:28px 20px;

border-radius:32px;

position:relative;

overflow:hidden;

text-align:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,.14),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

box-shadow:
0 10px 45px rgba(0,0,0,.35),
0 0 90px rgba(168,85,247,.12),
inset 0 1px 1px rgba(255,255,255,.08);

z-index:2;

transition:
transform .3s ease,
opacity .3s ease;
}

.card::before{
content:"";
position:absolute;
inset:0;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.08),
transparent
);

animation:shine 8s linear infinite;
}

@keyframes shine{
from{
transform:translateX(-120%);
}
to{
transform:translateX(120%);
}
}

.hidden{
display:none;
}

.motion-game.hidden{
display:none !important;
}

.fade{
opacity:0;
transform:scale(.94);
}

.heart-top{
font-size:60px;
margin-bottom:12px;
filter:drop-shadow(0 0 16px rgba(255,255,255,.55));
}

.photo{
width:100%;
max-width:260px;
height:320px;
object-fit:cover;

border-radius:24px;

margin:0 auto 22px auto;

display:block;

border:2px solid rgba(255,255,255,.12);

box-shadow:
0 10px 35px rgba(0,0,0,.35),
0 0 25px rgba(139,92,246,.25);
}

h1{
font-size:38px;
font-weight:900;
line-height:1;
letter-spacing:-2px;
margin-bottom:18px;

background:
linear-gradient(
135deg,
#fff,
#c4b5fd,
#7dd3fc
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.text{
font-size:17px;
line-height:1.8;
color:rgba(255,255,255,.88);
margin-bottom:24px;
text-align:center;
}

#question{
font-size:24px;
line-height:1.5;

padding:22px;

border-radius:24px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.08);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.06),
0 10px 30px rgba(0,0,0,.18);

margin-bottom:30px;

text-align:center;
}

.decorations{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:18px;
opacity:.85;
}

.buttons{
position:relative;
width:100%;
height:170px;
overflow:hidden;
}

button{
border:none;
cursor:pointer;
position:absolute;

border-radius:999px;

padding:16px 26px;

font-size:21px;
font-weight:800;

color:white;

transition:
left .25s ease,
top .25s ease,
transform .2s ease;
}

button:active{
transform:scale(.96);
}

#yesBtn{
left:10px;
top:50%;
transform:translateY(-50%);

background:
linear-gradient(
135deg,
#38bdf8,
#8b5cf6
);

box-shadow:
0 0 30px rgba(56,189,248,.35);
}

#noBtn{
left:190px;
top:50%;
transform:translateY(-50%);

background:
linear-gradient(
135deg,
#f472b6,
#a855f7
);

box-shadow:
0 0 30px rgba(244,114,182,.3);
}

.shake-area{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:24px;
min-height:260px;
}

.shake-circle{
width:120px;
height:120px;
border-radius:999px;

background:
linear-gradient(
135deg,
#38bdf8,
#8b5cf6
);

display:flex;
align-items:center;
justify-content:center;

font-size:52px;

animation:pulse 2s infinite;

box-shadow:
0 0 50px rgba(139,92,246,.45);
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}
}

.enter-btn{
position:relative !important;
left:auto !important;
top:auto !important;
transform:none !important;

width:100%;

margin-top:10px;
}

.motion-game{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.motion-track{
width:100%;
height:12px;
border-radius:999px;
background:rgba(255,255,255,.12);
position:relative;
overflow:hidden;
}

.motion-ball{
width:50px;
height:50px;
border-radius:999px;

background:
linear-gradient(
135deg,
#38bdf8,
#8b5cf6
);

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

box-shadow:
0 0 35px rgba(255,255,255,.45);

transition:left .08s linear;
}

.motion-labels{
width:100%;
display:flex;
justify-content:space-between;
font-size:18px;
font-weight:700;
}

.heart{
position:fixed;
top:-50px;
pointer-events:none;
z-index:9999;
animation:fall linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}

to{
transform:translateY(120vh) rotate(360deg);
opacity:0;
}
}

@media(min-width:769px){

.card{
max-width:700px;
padding:50px;
}

h1{
font-size:64px;
}

.text{
font-size:22px;
}

#question{
font-size:32px;
padding:30px;
}

.buttons{
height:200px;
}

button{
font-size:25px;
padding:18px 36px;
}

#yesBtn{
left:90px;
}

#noBtn{
left:390px;
}

}

</style>
</head>

<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div id="loginScreen" class="card">

<div class="shake-area">

<img src="foto1.jpg" class="photo">

<div class="heart-top">💖</div>

<h1>Área Secreta</h1>

<p class="text">
Sacuda o celular para desbloquear a surpresa ✨
</p>

<div class="shake-circle">
📱
</div>

<button id="enterBtn" class="hidden enter-btn">
Entrar 💜
</button>

</div>

</div>

<div id="card" class="card hidden">

<div class="heart-top">♡</div>

<img id="mainPhoto" class="photo" src="foto2.jpg">

<h1 id="title">
Para o amor da minha vida 💜
</h1>

<p class="text" id="mainText">
Desde que você apareceu na minha vida, tudo ficou mais bonito.
</p>

<div class="decorations">
<span>✧</span>
<span>♡</span>
<span>✧</span>
</div>

<div id="question">
Você gosta de viver momentos comigo? ✨
</div>

<div id="motionGame" class="motion-game hidden">

<div class="motion-labels">
<span>❌ Não</span>
<span>✅ Sim</span>
</div>

<div class="motion-track">
<div class="motion-ball" id="motionBall"></div>
</div>

<p class="text" style="margin-bottom:0;">
Incline o celular para a direita 💖
</p>

</div>

<div class="buttons">

<button id="yesBtn">
♡ Sim
</button>

<button id="noBtn">
Não 🏃
</button>

</div>

</div>

<script>

const questions = [
{
title:"Você é meu lugar favorito 💙",
text:"Cada conversa com você deixa meus dias melhores.",
question:"Promete continuar comigo por muito tempo? 💖",
image:"foto2.jpg"
},

{
title:"Modo Especial 💜",
text:"Agora mova o celular para responder.",
question:"Incline o celular ✨",
motion:true,
image:"foto3.jpg"
},

{
title:"Última pergunta 💚",
text:"Você transformou minha vida em algo muito mais feliz.",
question:"Aceita ser meu amor pra sempre? 💍",
image:"foto4.jpg"
}
];

const loginScreen = document.getElementById("loginScreen");
const card = document.getElementById("card");

const enterBtn = document.getElementById("enterBtn");

const title = document.getElementById("title");
const text = document.getElementById("mainText");
const question = document.getElementById("question");

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const buttons = document.querySelector(".buttons");

const motionGame = document.getElementById("motionGame");
const motionBall = document.getElementById("motionBall");

const mainPhoto = document.getElementById("mainPhoto");

let step = 0;
let shakeUnlocked = false;

function resetButtons(){

if(window.innerWidth <= 768){

yesBtn.style.left = "10px";
noBtn.style.left = "190px";

}else{

yesBtn.style.left = "90px";
noBtn.style.left = "390px";

}

yesBtn.style.top = "50%";
noBtn.style.top = "50%";

yesBtn.style.transform = "translateY(-50%)";
noBtn.style.transform = "translateY(-50%)";

}

resetButtons();

window.addEventListener("resize", resetButtons);

function unlockLogin(){

if(shakeUnlocked) return;

shakeUnlocked = true;

enterBtn.classList.remove("hidden");

navigator.vibrate?.(200);

}

window.addEventListener("devicemotion",(event)=>{

const acc = event.accelerationIncludingGravity;

if(!acc) return;

const force =
Math.abs(acc.x || 0) +
Math.abs(acc.y || 0) +
Math.abs(acc.z || 0);

if(force > 40){

unlockLogin();

}

});

enterBtn.onclick = () => {

loginScreen.classList.add("fade");

setTimeout(()=>{

loginScreen.classList.add("hidden");
card.classList.remove("hidden");

},300);

};

yesBtn.onclick = () => {

nextQuestion();

};

noBtn.onclick = moveNoButton;

function nextQuestion(){

if(step >= questions.length){

showFinal();
return;

}

const current = questions[step];

card.classList.add("fade");

setTimeout(()=>{

title.textContent = current.title;
text.textContent = current.text;
question.textContent = current.question;

mainPhoto.src = current.image;

if(current.motion){

buttons.classList.add("hidden");

motionGame.classList.remove("hidden");
motionGame.style.display = "flex";

startMotionGame();

}else{

motionGame.classList.add("hidden");
motionGame.style.display = "none";

buttons.classList.remove("hidden");

resetButtons();

}

card.classList.remove("fade");

},250);

step++;

}

function moveNoButton(){

const maxX =
buttons.clientWidth - noBtn.offsetWidth;

const maxY =
buttons.clientHeight - noBtn.offsetHeight;

const yesX = yesBtn.offsetLeft;
const yesY = yesBtn.offsetTop;

const safeDistance = 150;

let valid = false;
let attempts = 0;

while(!valid && attempts < 100){

const x = Math.random() * maxX;
const y = Math.random() * maxY;

const distance =
Math.hypot(
x - yesX,
y - yesY
);

if(distance > safeDistance){

noBtn.style.left = `${x}px`;
noBtn.style.top = `${y}px`;
noBtn.style.transform = "none";

valid = true;

}

attempts++;

}

}

function startMotionGame(){

motionBall.style.left = "50%";

function handleOrientation(event){

const gamma = event.gamma || 0;

let percentage =
((gamma + 45) / 90) * 100;

if(percentage < 0) percentage = 0;
if(percentage > 100) percentage = 100;

motionBall.style.left = `${percentage}%`;

if(percentage >= 92){

window.removeEventListener(
"deviceorientation",
handleOrientation
);

motionBall.style.left = "50%";

setTimeout(()=>{
nextQuestion();
},700);

}

if(percentage <= 8){

motionBall.style.left = "50%";

navigator.vibrate?.(100);

}

}

window.addEventListener(
"deviceorientation",
handleOrientation
);

}

function showFinal(){

card.innerHTML = `
<div class="letter">

<img src="foto5.jpg" class="photo">

<div style="
font-size:72px;
margin-bottom:20px;
">
💌
</div>

<h1>
Carta de Amor
</h1>

<p style="
font-size:22px;
line-height:1.8;
margin-bottom:30px;
text-align:center;
">
Você é a melhor parte dos meus dias.<br><br>

Obrigado por existir e deixar minha vida muito mais feliz 💖
</p>

<div style="
font-size:40px;
font-weight:900;
text-align:center;
">
💖 EU TE AMO 💖
</div>

</div>
`;

startHearts();

}

function startHearts(){

setInterval(()=>{

const heart =
document.createElement("div");

heart.className = "heart";

heart.innerHTML = "💖";

heart.style.left =
Math.random() * window.innerWidth + "px";

heart.style.fontSize =
(Math.random() * 18 + 18) + "px";

heart.style.animationDuration =
(Math.random() * 2 + 3) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},180);

}

</script>

</body>
</html>
