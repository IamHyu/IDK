<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>💖 Carta Especial 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#ff4d88,#6a5cff);
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.hidden{
display:none !important;
}

.fade{
opacity:0;
transform:scale(.95);
transition:.3s;
}

.screen,
.card{
width:90%;
max-width:700px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(14px);
border-radius:30px;
padding:40px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
text-align:center;
position:relative;
}

h1{
font-size:42px;
margin-bottom:20px;
}

p{
font-size:22px;
line-height:1.6;
margin-bottom:30px;
}

.question{
font-size:28px;
font-weight:700;
margin-bottom:40px;
}

button{
border:none;
padding:16px 38px;
border-radius:999px;
font-size:22px;
font-weight:700;
cursor:pointer;
transition:.25s;
position:absolute;
}

#yesBtn{
background:#00ff88;
color:#111;
}

#noBtn{
background:#ff4d6d;
color:white;
}

.buttons{
position:relative;
width:100%;
height:250px;
}

#enterBtn{
position:relative;
margin-top:25px;
background:white;
color:#333;
}

.motion-wrapper{
margin-top:30px;
}

.motion-bar{
width:100%;
height:18px;
background:rgba(255,255,255,.2);
border-radius:999px;
position:relative;
overflow:hidden;
margin-top:25px;
}

.motion-ball{
width:50px;
height:50px;
border-radius:50%;
background:white;
position:absolute;
top:50%;
transform:translate(-50%,-50%);
left:50%;
transition:.08s linear;
box-shadow:0 0 20px rgba(255,255,255,.8);
}

.heart{
position:fixed;
bottom:-50px;
animation:floatUp linear forwards;
pointer-events:none;
z-index:9999;
}

@keyframes floatUp{

0%{
transform:translateY(0) scale(1);
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

@media(max-width:768px){

h1{
font-size:30px;
}

p{
font-size:18px;
}

.question{
font-size:22px;
}

button{
font-size:18px;
padding:14px 28px;
}

}

</style>

</head>

<body>

<div id="loginScreen" class="screen">

<h1>💖 Uma surpresa pra você 💖</h1>

<p>
Balance o celular para desbloquear ✨
</p>

<button id="enterBtn" class="hidden">
Entrar 💌
</button>

</div>

<div id="card" class="card hidden">

<h1 id="title">
Você é especial 💖
</h1>

<p id="mainText">
Cada momento com você vale a pena ✨
</p>

<div id="question" class="question">
Quer continuar? 💕
</div>

<div class="buttons">

<button id="yesBtn">
Sim 💖
</button>

<button id="noBtn">
Não 😅
</button>

</div>

<div id="motionGame" class="motion-wrapper hidden">

<h2>
Incline o celular para a direita 👉
</h2>

<div class="motion-bar">

<div id="motionBall" class="motion-ball"></div>

</div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

const questions = [
{
title:"Você é meu lugar favorito 💙",
text:"Cada conversa com você deixa meus dias melhores.",
question:"Promete continuar comigo por muito tempo? 💖"
},

{
title:"Modo Especial 💜",
text:"Agora mova o celular para responder.",
question:"Incline o celular ✨",
motion:true
},

{
title:"Última pergunta 💚",
text:"Você transformou minha vida em algo muito mais feliz.",
question:"Aceita ser meu amor pra sempre? 💍"
}
];

const loginScreen = document.getElementById("loginScreen");
const card = document.getElementById("card");

const enterBtn = document.getElementById("enterBtn");

const title = document.getElementById("title");
const text = document.getElementById("mainText");
const question = document.getElementById("question");

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const buttons = document.querySelector(".buttons");

const motionGame = document.getElementById("motionGame");
const motionBall = document.getElementById("motionBall");

let step = 0;
let shakeUnlocked = false;
let orientationHandler = null;

function resetButtons(){

if(window.innerWidth <= 768){

yesBtn.style.left = "10px";
noBtn.style.left = "190px";

}else{

yesBtn.style.left = "90px";
noBtn.style.left = "390px";

}

yesBtn.style.top = "50%";
noBtn.style.top = "50%";

yesBtn.style.transform = "translateY(-50%)";
noBtn.style.transform = "translateY(-50%)";

}

resetButtons();

window.addEventListener("resize", resetButtons);

function unlockLogin(){

if(shakeUnlocked) return;

shakeUnlocked = true;

enterBtn.classList.remove("hidden");

navigator.vibrate?.(200);

}

window.addEventListener("devicemotion",(event)=>{

const acc = event.accelerationIncludingGravity;

if(!acc) return;

const force =
Math.abs(acc.x || 0) +
Math.abs(acc.y || 0) +
Math.abs(acc.z || 0);

if(force > 40){

unlockLogin();

}

});

enterBtn.onclick = () => {

loginScreen.classList.add("fade");

setTimeout(()=>{

loginScreen.classList.add("hidden");
card.classList.remove("hidden");

nextQuestion();

},300);

};

yesBtn.onclick = () => {

nextQuestion();

};

noBtn.onclick = moveNoButton;

function nextQuestion(){

if(step >= questions.length){

showFinal();
return;

}

const current = questions[step];

card.classList.add("fade");

setTimeout(()=>{

title.textContent = current.title;
text.textContent = current.text;
question.textContent = current.question;

motionGame.classList.add("hidden");
buttons.classList.add("hidden");

if(current.motion === true){

motionGame.classList.remove("hidden");

startMotionGame();

}else{

buttons.classList.remove("hidden");

resetButtons();

}

card.classList.remove("fade");

},250);

step++;

}

function moveNoButton(){

const maxX =
buttons.clientWidth - noBtn.offsetWidth;

const maxY =
buttons.clientHeight - noBtn.offsetHeight;

let valid = false;
let attempts = 0;

while(!valid && attempts < 100){

const x = Math.random() * maxX;
const y = Math.random() * maxY;

const distance =
Math.hypot(
x - yesBtn.offsetLeft,
y - yesBtn.offsetTop
);

if(distance > 170){

noBtn.style.left = `${x}px`;
noBtn.style.top = `${y}px`;
noBtn.style.transform = "none";

valid = true;

}

attempts++;

}

}

function startMotionGame(){

motionBall.style.left = "50%";

if(orientationHandler){

window.removeEventListener(
"deviceorientation",
orientationHandler
);

}

orientationHandler = (event) => {

const gamma = event.gamma || 0;

let percentage =
((gamma + 45) / 90) * 100;

if(percentage < 0) percentage = 0;
if(percentage > 100) percentage = 100;

motionBall.style.left = `${percentage}%`;

if(percentage >= 92){

window.removeEventListener(
"deviceorientation",
orientationHandler
);

motionBall.style.left = "50%";

setTimeout(()=>{

motionGame.classList.add("hidden");
buttons.classList.remove("hidden");

nextQuestion();

},700);

}

};

window.addEventListener(
"deviceorientation",
orientationHandler
);

}

function showFinal(){

card.innerHTML = `
<div class="letter">

<div style="
font-size:72px;
margin-bottom:20px;
text-align:center;
">
💌
</div>

<h1 style="text-align:center;">
Carta de Amor
</h1>

<p style="
font-size:22px;
line-height:1.8;
margin-bottom:30px;
text-align:center;
">
Você é a melhor parte dos meus dias.<br><br>

Obrigado por existir e deixar minha vida muito mais feliz 💖
</p>

<div style="
font-size:40px;
font-weight:900;
text-align:center;
">
💖 EU TE AMO 💖
</div>

</div>
`;

startHearts();

}

function startHearts(){

setInterval(()=>{

const heart =
document.createElement("div");

heart.className = "heart";

heart.innerHTML = "💖";

heart.style.left =
Math.random() * window.innerWidth + "px";

heart.style.fontSize =
(Math.random() * 18 + 18) + "px";

heart.style.animationDuration =
(Math.random() * 2 + 3) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},180);

}

});

</script>

</body>
</html>
