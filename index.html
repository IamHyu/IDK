<script>

const questions = [
{
title:"Você é meu lugar favorito 💙",
text:"Cada conversa com você deixa meus dias melhores.",
question:"Promete continuar comigo por muito tempo? 💖"
},

{
title:"Modo Especial 💜",
text:"Agora mova o celular para responder.",
question:"Incline o celular ✨",
motion:true
},

{
title:"Última pergunta 💚",
text:"Você transformou minha vida em algo muito mais feliz.",
question:"Aceita ser meu amor pra sempre? 💍"
}
];

const loginScreen = document.getElementById("loginScreen");
const card = document.getElementById("card");

const enterBtn = document.getElementById("enterBtn");

const title = document.getElementById("title");
const text = document.getElementById("mainText");
const question = document.getElementById("question");

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const buttons = document.querySelector(".buttons");

const motionGame = document.getElementById("motionGame");
const motionBall = document.getElementById("motionBall");

let step = 0;
let shakeUnlocked = false;
let orientationHandler = null;

function resetButtons(){

if(window.innerWidth <= 768){

yesBtn.style.left = "10px";
noBtn.style.left = "190px";

}else{

yesBtn.style.left = "90px";
noBtn.style.left = "390px";

}

yesBtn.style.top = "50%";
noBtn.style.top = "50%";

yesBtn.style.transform = "translateY(-50%)";
noBtn.style.transform = "translateY(-50%)";

}

resetButtons();

window.addEventListener("resize", resetButtons);

function unlockLogin(){

if(shakeUnlocked) return;

shakeUnlocked = true;

enterBtn.classList.remove("hidden");

navigator.vibrate?.(200);

}

window.addEventListener("devicemotion",(event)=>{

const acc = event.accelerationIncludingGravity;

if(!acc) return;

const force =
Math.abs(acc.x || 0) +
Math.abs(acc.y || 0) +
Math.abs(acc.z || 0);

if(force > 40){

unlockLogin();

}

});

enterBtn.onclick = () => {

loginScreen.classList.add("fade");

setTimeout(()=>{

loginScreen.classList.add("hidden");
card.classList.remove("hidden");

},300);

};

yesBtn.onclick = () => {

nextQuestion();

};

noBtn.onclick = moveNoButton;

function nextQuestion(){

if(step >= questions.length){

showFinal();
return;

}

const current = questions[step];

card.classList.add("fade");

setTimeout(()=>{

title.textContent = current.title;
text.textContent = current.text;
question.textContent = current.question;

if(current.motion === true){

buttons.classList.add("hidden");
motionGame.classList.remove("hidden");

startMotionGame();

}else{

motionGame.classList.add("hidden");
buttons.classList.remove("hidden");

resetButtons();

}

card.classList.remove("fade");

},250);

step++;

}

function moveNoButton(){

const maxX =
buttons.clientWidth - noBtn.offsetWidth;

const maxY =
buttons.clientHeight - noBtn.offsetHeight;

const yesRect = yesBtn.getBoundingClientRect();

const safeDistance = 170;

let valid = false;
let attempts = 0;

while(!valid && attempts < 100){

const x = Math.random() * maxX;
const y = Math.random() * maxY;

const noRect = {
left:x,
right:x + noBtn.offsetWidth,
top:y,
bottom:y + noBtn.offsetHeight
};

const distance =
Math.hypot(
x - yesBtn.offsetLeft,
y - yesBtn.offsetTop
);

const collision = !(
noRect.right < yesBtn.offsetLeft - 25 ||
noRect.left > yesBtn.offsetLeft + yesBtn.offsetWidth + 25 ||
noRect.bottom < yesBtn.offsetTop - 25 ||
noRect.top > yesBtn.offsetTop + yesBtn.offsetHeight + 25
);

if(distance > safeDistance && !collision){

noBtn.style.left = `${x}px`;
noBtn.style.top = `${y}px`;
noBtn.style.transform = "none";

valid = true;

}

attempts++;

}

}

function startMotionGame(){

motionBall.style.left = "50%";

if(orientationHandler){

window.removeEventListener(
"deviceorientation",
orientationHandler
);

}

orientationHandler = (event) => {

const gamma = event.gamma || 0;

let percentage =
((gamma + 45) / 90) * 100;

if(percentage < 0) percentage = 0;
if(percentage > 100) percentage = 100;

motionBall.style.left = `${percentage}%`;

if(percentage <= 8){

navigator.vibrate?.(120);

motionBall.style.left = "50%";

}

if(percentage >= 92){

window.removeEventListener(
"deviceorientation",
orientationHandler
);

motionBall.style.left = "50%";

setTimeout(()=>{

motionGame.classList.add("hidden");
buttons.classList.remove("hidden");

nextQuestion();

},700);

}

};

window.addEventListener(
"deviceorientation",
orientationHandler
);

}

function showFinal(){

card.innerHTML = `
<div class="letter">

<div style="
font-size:72px;
margin-bottom:20px;
text-align:center;
">
💌
</div>

<h1 style="text-align:center;">
Carta de Amor
</h1>

<p style="
font-size:22px;
line-height:1.8;
margin-bottom:30px;
text-align:center;
">
Você é a melhor parte dos meus dias.<br><br>

Obrigado por existir e deixar minha vida muito mais feliz 💖
</p>

<div style="
font-size:40px;
font-weight:900;
text-align:center;
">
💖 EU TE AMO 💖
</div>

</div>
`;

startHearts();

}

function startHearts(){

setInterval(()=>{

const heart =
document.createElement("div");

heart.className = "heart";

heart.innerHTML = "💖";

heart.style.left =
Math.random() * window.innerWidth + "px";

heart.style.fontSize =
(Math.random() * 18 + 18) + "px";

heart.style.animationDuration =
(Math.random() * 2 + 3) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},180);

}

</script>
