<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Para Meu Amor 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --glass:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.12);
  --white-soft:rgba(255,255,255,.85);
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Inter",sans-serif;
  position:relative;
  color:white;

  background:
  radial-gradient(circle at top left,#8b5cf6 0%,transparent 25%),
  radial-gradient(circle at bottom right,#38bdf8 0%,transparent 25%),
  linear-gradient(135deg,#0f172a 0%,#1e1b4b 40%,#312e81 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
  radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);

  background-size:40px 40px;

  opacity:.3;

  animation:bgMove 16s linear infinite;
}

@keyframes bgMove{
  from{
    transform:translateY(0px);
  }

  to{
    transform:translateY(-40px);
  }
}

.bg-glow{
  position:absolute;
  border-radius:999px;
  filter:blur(100px);
  opacity:.5;
  animation:float 12s ease-in-out infinite;
}

.glow1{
  width:320px;
  height:320px;
  background:#a855f7;
  top:-100px;
  left:-100px;
}

.glow2{
  width:360px;
  height:360px;
  background:#38bdf8;
  right:-120px;
  bottom:-120px;
  animation-duration:16s;
}

.glow3{
  width:260px;
  height:260px;
  background:#4ade80;
  left:45%;
  top:45%;
  animation-duration:20s;
}

@keyframes float{
  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(40px,-40px);
  }
}

.glass-card{
  width:min(92vw,980px);

  padding:clamp(26px,4vw,60px);

  border-radius:42px;

  position:relative;

  overflow:hidden;

  text-align:center;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.14),
    rgba(255,255,255,.03)
  );

  border:1px solid var(--glass-border);

  backdrop-filter:blur(35px);
  -webkit-backdrop-filter:blur(35px);

  box-shadow:
  0 10px 50px rgba(0,0,0,.35),
  0 0 120px rgba(168,85,247,.12),
  inset 0 1px 1px rgba(255,255,255,.08);

  z-index:2;

  transition:
  transform .35s ease,
  opacity .35s ease;
}

.glass-card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );

  animation:shine 8s linear infinite;
}

@keyframes shine{
  from{
    transform:translateX(-120%);
  }

  to{
    transform:translateX(120%);
  }
}

.heart-top{
  font-size:68px;
  margin-bottom:10px;

  filter:drop-shadow(0 0 18px rgba(255,255,255,.6));
}

h1{
  font-size:clamp(42px,5vw,78px);

  font-weight:900;

  letter-spacing:-3px;

  line-height:.95;

  margin-bottom:20px;

  background:
  linear-gradient(
    135deg,
    #fff,
    #c4b5fd,
    #7dd3fc
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#text{
  font-size:clamp(16px,2vw,24px);

  line-height:1.8;

  color:rgba(255,255,255,.88);

  margin-bottom:28px;

  max-width:700px;

  margin-inline:auto;
}

.decorations{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
  opacity:.85;
}

#question{
  font-size:clamp(22px,3vw,34px);

  line-height:1.5;

  padding:30px;

  border-radius:30px;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.12),
    rgba(255,255,255,.03)
  );

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
  inset 0 1px 0 rgba(255,255,255,.06),
  0 15px 35px rgba(0,0,0,.18);

  margin-bottom:42px;
}

.buttons{
  position:relative;

  width:min(700px,100%);

  height:180px;

  margin-inline:auto;
}

button{
  border:none;

  cursor:pointer;

  position:absolute;

  border-radius:999px;

  padding:
  18px
  42px;

  font-size:clamp(18px,2vw,28px);

  font-weight:800;

  color:white;

  overflow:hidden;

  transition:
  transform .22s ease,
  box-shadow .22s ease;
}

button:hover{
  transform:translateY(-4px);
}

button::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );

  transform:translateX(-120%);

  transition:transform .7s ease;
}

button:hover::before{
  transform:translateX(120%);
}

#yesBtn{
  left:40px;
  top:50%;

  transform:translateY(-50%);

  background:
  linear-gradient(
    135deg,
    #38bdf8,
    #8b5cf6
  );

  box-shadow:
  0 0 40px rgba(56,189,248,.35),
  0 0 90px rgba(139,92,246,.22);
}

#noBtn{
  right:40px;
  top:50%;

  transform:translateY(-50%);

  background:
  linear-gradient(
    135deg,
    #f472b6,
    #a855f7
  );

  box-shadow:
  0 0 40px rgba(244,114,182,.28);
}

.hidden{
  display:none;
}

.fade{
  opacity:0;
  transform:scale(.94);
}

.login-screen{
  max-width:520px;

  display:flex;
  flex-direction:column;
  gap:18px;
}

.login-input{
  width:100%;

  border:none;
  outline:none;

  padding:18px 22px;

  border-radius:20px;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.08);

  color:white;

  font-size:18px;

  backdrop-filter:blur(14px);
}

.login-input::placeholder{
  color:rgba(255,255,255,.55);
}

.heart{
  position:fixed;
  top:-50px;
  pointer-events:none;
  z-index:9999;

  animation:fall linear forwards;
}

@keyframes fall{
  from{
    transform:translateY(-100px) rotate(0deg);
    opacity:1;
  }

  to{
    transform:translateY(120vh) rotate(360deg);
    opacity:0;
  }
}

.letter{
  animation:openLetter .8s ease;
}

@keyframes openLetter{
  from{
    opacity:0;
    transform:scale(.7) rotateX(80deg);
  }

  to{
    opacity:1;
    transform:scale(1) rotateX(0);
  }
}

@media(max-width:768px){

  body{
    padding:18px;
  }

  .glass-card{
    width:100%;
    border-radius:34px;
    padding:28px 18px;
  }

  h1{
    font-size:42px;
  }

  #question{
    padding:22px;
    font-size:24px;
  }

  .buttons{
    height:220px;
  }

  button{
    padding:16px 28px;
    font-size:22px;
  }

  #yesBtn{
    left:10px;
  }

  #noBtn{
    right:10px;
  }
}
</style>
</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="bg-glow glow3"></div>

<div id="loginScreen" class="glass-card login-screen">

<div class="heart-top">💖</div>

<h1>Área Secreta</h1>

<p id="text">
Entre para descobrir uma surpresa especial ✨
</p>

<input class="login-input" placeholder="Digite seu nome">

<input class="login-input" type="password" placeholder="Digite sua senha">

<button id="loginBtn">
Entrar 💜
</button>

</div>

<div id="card" class="glass-card hidden">

<div class="heart-top">♡</div>

<h1 id="title">
Para o amor da minha vida 💜
</h1>

<p id="text">
Desde que você apareceu na minha vida, tudo ficou mais bonito.
</p>

<div class="decorations">
<span>✧</span>
<span>♡</span>
<span>✧</span>
</div>

<div id="question">
Você gosta de viver momentos comigo? ✨
</div>

<div class="buttons">

<button id="yesBtn">
♡ Sim
</button>

<button id="noBtn">
Não 🏃
</button>

</div>
</div>

<script>
const questions = [
{
title:"Você é meu lugar favorito 💙",
text:"Cada conversa com você deixa meus dias melhores.",
question:"Promete continuar comigo por muito tempo? 💖"
},

{
title:"Última pergunta 💚",
text:"Você transformou minha vida em algo muito mais feliz.",
question:"Aceita ser meu amor pra sempre? 💍"
}
];

const loginScreen = document.getElementById("loginScreen");
const card = document.getElementById("card");

const loginBtn = document.getElementById("loginBtn");

const title = document.getElementById("title");
const text = document.querySelectorAll("#text")[1];
const question = document.getElementById("question");

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const buttons = document.querySelector(".buttons");

let step = 0;
let heartInterval = null;

loginBtn.onclick = () => {

loginScreen.classList.add("fade");

setTimeout(() => {

loginScreen.classList.add("hidden");

card.classList.remove("hidden");

},300);

};

yesBtn.onclick = () => {

if(step >= questions.length){

showFinal();

return;

}

const current = questions[step];

card.classList.add("fade");

setTimeout(()=>{

title.textContent = current.title;
text.textContent = current.text;
question.textContent = current.question;

card.classList.remove("fade");

},250);

step++;

};

noBtn.onclick = moveNoButton;

function moveNoButton(){

const maxX = buttons.clientWidth - noBtn.offsetWidth;
const maxY = buttons.clientHeight - noBtn.offsetHeight;

const yesRect = yesBtn.getBoundingClientRect();

let valid = false;

while(!valid){

const x = Math.random() * maxX;
const y = Math.random() * maxY;

const future = {
left:x,
right:x + noBtn.offsetWidth,
top:y,
bottom:y + noBtn.offsetHeight
};

const collision = !(
future.right < yesBtn.offsetLeft - 20 ||
future.left > yesBtn.offsetLeft + yesBtn.offsetWidth + 20 ||
future.bottom < yesBtn.offsetTop - 20 ||
future.top > yesBtn.offsetTop + yesBtn.offsetHeight + 20
);

if(!collision){

noBtn.style.left = `${x}px`;
noBtn.style.top = `${y}px`;
noBtn.style.right = "auto";
noBtn.style.transform = "none";

valid = true;

}

}

}

function showFinal(){

card.innerHTML = `
<div class="letter">

<div style="font-size:72px;margin-bottom:20px;">
💌
</div>

<h1>
Carta de Amor
</h1>

<p style="
font-size:24px;
line-height:1.8;
max-width:700px;
margin:auto;
margin-bottom:30px;
">
Você é a melhor parte dos meus dias.<br><br>

Obrigado por existir e deixar minha vida muito mais feliz 💖
</p>

<div style="
font-size:42px;
font-weight:900;
">
💖 EU TE AMO 💖
</div>

</div>
`;

startHearts();

}

function startHearts(){

heartInterval = setInterval(()=>{

const heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "💖";

heart.style.left = Math.random() * window.innerWidth + "px";

heart.style.fontSize =
(Math.random() * 18 + 18) + "px";

heart.style.animationDuration =
(Math.random() * 2 + 3) + "s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},5000);

},180);

}
</script>

</body>
</html>
